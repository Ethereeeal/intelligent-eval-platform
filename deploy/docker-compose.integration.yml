name: evalforge-integration

services:
  mysql:
    image: mysql:8.0
    container_name: evalforge-it-mysql
    environment:
      MYSQL_ROOT_PASSWORD: integration-root
      MYSQL_DATABASE: evalforge_integration
      MYSQL_USER: evalforge
      MYSQL_PASSWORD: integration-only
    ports:
      - "13306:3306"
    volumes:
      - integration_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pintegration-root"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: evalforge-it-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: integration-minio
      MINIO_ROOT_PASSWORD: integration-only
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - integration_minio_data:/data

  integration-stub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.integration-stub
    image: evalforge-integration-stub:local
    container_name: evalforge-it-stub
    ports:
      - "18090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: evalforge-integration-backend:local
    container_name: evalforge-it-backend
    env_file:
      - ../.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: evalforge
      MYSQL_PASSWORD: integration-only
      MYSQL_DATABASE: evalforge_integration
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: integration-minio
      MINIO_SECRET_KEY: integration-only
      EMBEDDING_MODEL_PATH: /app/models/bge-small-zh-v1.5
      LLM_API_BASE: http://integration-stub:8090/v1
      LLM_API_URL: http://integration-stub:8090/v1/chat/completions
      LLM_API_KEY: integration-stub-key
      LLM_MODEL: integration-stub
      LLM_TEMPERATURE: "0.0"
      LLM_MAX_TOKENS: "2048"
    ports:
      - "18000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - integration_backend_storage:/app/storage
      - ../models:/app/models
    networks:
      default:
        aliases:
          - evalforge-backend
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
      integration-stub:
        condition: service_healthy

  studio:
    build:
      context: ../front-end
      dockerfile: Dockerfile
    container_name: evalforge-it-studio
    ports:
      - "18080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  integration_mysql_data:
  integration_minio_data:
  integration_backend_storage:
