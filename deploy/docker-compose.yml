services:
  mysql:
    image: mysql:8.0
    container_name: evalforge-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: evalforge
      MYSQL_USER: evalforge
      MYSQL_PASSWORD: evalforge
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: evalforge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: evalforge-backend
    env_file:
      - ../.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: evalforge
      MYSQL_PASSWORD: evalforge
      MYSQL_DATABASE: evalforge
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio12345
      EMBEDDING_MODEL_PATH: "/app/models/bge-small-zh-v1.5"   # 宿主机 ./models 挂载进容器
      # LLM（OpenAI 兼容 API）：DeepSeek，配置来自 ../.env（已 gitignore，本地使用，不入库）
      LLM_TEMPERATURE: "0.1"
      LLM_MAX_TOKENS: "4096"
      # P0 安全加固：生产必须设置 API_TOKEN（默认关闭，Demo 联调保持无鉴权）；
      # CORS 白名单默认 localhost:8080（前端同源代理），直连/局域网访问按需追加
      # API_TOKEN: "change-me"
      # CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      # 解析资源上限（压缩炸弹防护，默认值已足够，可按需调小）
      # MAX_PDF_PAGES: "500"
      # MAX_TABLE_ROWS: "100000"
      # MAX_XLSX_CELLS: "500000"
      # MAX_DOCX_BLOCKS: "200000"
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage   # 持久化原始文档 / 解析结果 / FAISS 索引
      - ../models:/app/models          # 挂载本地 BGE 模型（bge-small-zh-v1.5 / bge-reranker-v2-m3），避免运行时联网
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started

  # 纯静态前端工作台（AI Eval Studio）：nginx 托管，无构建、无后端依赖
  # 构建上下文限定在前端目录 front-end/，仅打包静态资源，不误带后端源码/依赖
  studio:
    build:
      context: ../front-end
      dockerfile: Dockerfile
    container_name: evalforge-studio
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
  minio_data:
    driver: local
  backend_storage:
    driver: local
