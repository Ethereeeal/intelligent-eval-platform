services:
  mysql:
    image: mysql:8.0
    container_name: evalforge-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: evalforge
      MYSQL_USER: evalforge
      MYSQL_PASSWORD: evalforge
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: evalforge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: evalforge-backend
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: evalforge
      MYSQL_PASSWORD: evalforge
      MYSQL_DATABASE: evalforge
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio12345
      EMBEDDING_MODEL_NAME: "BAAI/bge-small-zh-v1.5"
      HF_ENDPOINT: "https://hf-mirror.com"
      LOCAL_MODELS_DIR: "/app/models"   # 宿主机 ./models 挂载进容器的本地模型目录
      # LLM（M02 EIU 抽取，OpenAI 兼容 API；缺省 Key 为占位符时容器内自动离线抽取）
      LLM_API_BASE: "${LLM_API_BASE:-https://api.openai.com/v1}"
      LLM_API_KEY: "${LLM_API_KEY:-sk-xxx}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      LLM_TEMPERATURE: "${LLM_TEMPERATURE:-0.1}"
      LLM_MAX_TOKENS: "${LLM_MAX_TOKENS:-4096}"
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage   # 持久化原始文档 / 解析结果 / FAISS 索引
      - ../models:/app/models          # 挂载本地 BGE 模型（bge-small-zh-v1.5 / bge-reranker-v2-m3），避免运行时联网
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started

  # 纯静态前端工作台（AI Eval Studio）：nginx 托管，无构建、无后端依赖
  studio:
    build:
      context: ..
      dockerfile: ai-eval-studio/Dockerfile
    container_name: evalforge-studio
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  minio_data:
  backend_storage:
