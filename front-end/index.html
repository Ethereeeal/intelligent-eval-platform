<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>评测平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="lucide.min.js"></script>
  <link rel="stylesheet" href="styles.css?v=26" />
  <script src="chart.umd.min.js"></script>
</head>
<body>
  <!-- 背景：放射状渐变光斑（几乎静止） -->
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span><span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <div class="app">
    <!-- 顶部栏：五大栏目 + 搜索 + 提醒 + 个人设置 + 智能问答（同一行） -->
    <header class="topbar" id="topbar">
      <div class="brand">
        <span class="logo"><i data-lucide="brain-circuit"></i></span>
        <span class="brand-name">评测<b>平台</b></span>
      </div>
      <nav class="nav" id="nav"><!-- 由 app.js 渲染五大栏目 --></nav>
      <div class="top-utils">
        <button class="icon-btn bell" id="bellBtn" aria-label="提醒"><i data-lucide="bell"></i><span class="bell-count" id="bellCount"></span></button>
        <button class="icon-btn" id="settingsBtn" aria-label="个人设置"><i data-lucide="settings"></i></button>
        <button class="btn ask-btn" id="askBtn"><i data-lucide="message-circle"></i>智能问答</button>
        <div class="avatar">YY</div>
      </div>
    </header>

    <main class="content" id="content">
      <div class="split-left" id="splitLeft">

        <!-- ============ 概览 ============ -->
        <section class="view" data-view="overview">
          <div class="page-head">
            <div><h1>概览</h1><p class="sub">平台运行状态与最近评测表现</p></div>
          </div>

          <div class="hl-banner">
            <div class="hl-ic"><i data-lucide="sparkles"></i></div>
            <div class="hl-tx"><div class="hl-t">平台状态</div>
              <div class="hl-d" id="hlInsight">加载中…</div></div>
          </div>

          <div class="kpi-grid">
            <div class="kpi kpi-link" data-go="doclib" role="link" tabindex="0" title="查看文档库"><div class="kpi-top"><span class="kpi-ic" style="--c:#124571"><i data-lucide="file-check-2"></i></span><span class="kpi-label">文档解析健康度</span></div><div class="kpi-num" id="kpiDocs">—</div><div class="kpi-trend" id="kpiDocsMeta">加载中…</div></div>
            <div class="kpi kpi-link" data-go="evalset" role="link" tabindex="0" title="查看待修订项"><div class="kpi-top"><span class="kpi-ic" style="--c:#B9770E"><i data-lucide="circle-alert"></i></span><span class="kpi-label">待处理事项</span></div><div class="kpi-num" id="kpiTodo">—</div><div class="kpi-trend" id="kpiTodoMeta">加载中…</div></div>
            <div class="kpi kpi-link" data-go="evalset" role="link" tabindex="0" title="查看评测库"><div class="kpi-top"><span class="kpi-ic" style="--c:#1B8A5A"><i data-lucide="library-big"></i></span><span class="kpi-label">可用评测集</span></div><div class="kpi-num" id="kpiEvalSets">—</div><div class="kpi-trend" id="kpiEvalSetsMeta">加载中…</div></div>
            <div class="kpi kpi-link" data-go="evaluation" role="link" tabindex="0" title="查看评测结果"><div class="kpi-top"><span class="kpi-ic" style="--c:#8C7CF0"><i data-lucide="chart-no-axes-combined"></i></span><span class="kpi-label">最新完成评测</span></div><div class="kpi-num" id="kpiLatestRun">—</div><div class="kpi-trend" id="kpiLatestRunMeta">加载中…</div></div>
          </div>

          <div class="panel open" id="overviewFlowPanel">
            <button class="panel-head" aria-expanded="true"><span><i data-lucide="workflow"></i>平台数据链路</span><i data-lucide="chevron-down" class="chev"></i></button>
            <button class="flow-toggle" id="overviewFlowToggle" type="button" aria-label="切换数据链路" title="切换数据链路"><i data-lucide="repeat-2"></i></button>
            <div class="panel-body"><div class="panel-inner">
              <div class="platform-flow flow-canvas" id="overviewFlowCanvas" aria-live="polite" aria-label="评测链路"></div>
            </div></div>
          </div>

          <div class="overview-lower">
            <section class="card card-pad overview-card"><div class="overview-card-head"><div><div class="card-t"><i data-lucide="list-todo"></i>待处理事项</div><p>优先处理影响数据可用性和评测结论的问题。</p></div><button class="btn ghost sm" data-go="evalset">查看评测集库</button></div><div class="overview-list" id="overviewTodos"><div class="overview-empty">正在加载待办…</div></div></section>
            <section class="card card-pad overview-card"><div class="overview-card-head"><div><div class="card-t"><i data-lucide="history"></i>最近运行</div><p>查看最近完成或正在执行的评测任务。</p></div><button class="btn ghost sm" data-go="evaluation">查看全部</button></div><div class="overview-list" id="overviewRuns"><div class="overview-empty">正在加载运行记录…</div></div></section>
          </div>
        </section>

        <!-- ============ 文档库管理 ============ -->
        <section class="view" data-view="doclib" hidden>
          <div class="page-head">
            <div><h1>文档库管理</h1><p class="sub">文档接入、解析、知识点管理与质量门禁</p></div>
            <div class="page-actions">
              <button class="btn ghost" id="uploadBtn"><i data-lucide="upload"></i>上传文档</button>
              <input type="file" id="uploadInput" accept=".pdf,.doc,.docx,.txt,.md,.xlsx,.xls,.csv" multiple hidden />
              <input type="file" id="uploadFolderInput" webkitdirectory directory multiple hidden />
            </div>
          </div>
          <div class="lib-split">
            <div class="tree" id="docTree">
              <div class="tree-bar"><span class="tree-bar-t">目录</span><button class="tree-toggle" id="treeToggle" title="隐藏/显示目录"><i data-lucide="chevron-left"></i></button></div>
            </div>
            <div id="docContent"></div>
          </div>
        </section>

        <!-- ============ 评测集库管理 ============ -->
        <section class="view" data-view="evalset" hidden>
          <div class="page-head">
            <div><h1>评测集库管理</h1><p class="sub">统一管理生成库、上传库、公共库与评测集库</p></div>
            <div class="page-actions">
              <button class="btn primary" id="esGenBtn"><i data-lucide="plus"></i>生成评测集</button>
              <button class="btn ghost" id="esUploadBtn"><i data-lucide="upload"></i>上传评测集</button>
              <input type="file" id="esUploadInput" accept=".json,.csv,.xlsx,.xls" multiple hidden />
            </div>
          </div>

          <div class="lib-split">
            <!-- 左侧目录：四类评测集库及其库文档 -->
            <div class="tree" id="esSubNav">
              <div class="tree-body">
                <div class="tree-node es-library-node">
                  <div class="tree-row" data-es="generate" aria-expanded="true"><i data-lucide="folder-kanban"></i><span>生成库</span><i data-lucide="chevron-down" class="tw-chev"></i></div>
                  <div class="tree-children open">
                    <div id="qaTree" class="es-library-tree"></div>
                  </div>
                </div>
                <div class="tree-node es-library-node">
                  <div class="tree-row" data-es="uploaded" aria-expanded="true"><i data-lucide="folder-up"></i><span>上传库</span><i data-lucide="chevron-down" class="tw-chev"></i></div>
                  <div id="esUploadedTree" class="tree-children open"></div>
                </div>
                <div class="tree-node es-library-node">
                  <div class="tree-row" data-es="public" aria-expanded="true"><i data-lucide="folder-open"></i><span>公共库</span><i data-lucide="chevron-down" class="tw-chev"></i></div>
                  <div id="esPublicTree" class="tree-children open"></div>
                </div>
                <div class="tree-node es-library-node">
                  <div class="tree-row" data-es="custom" aria-expanded="true"><i data-lucide="folder-cog"></i><span>评测集库</span><i data-lucide="chevron-down" class="tw-chev"></i></div>
                  <div id="esCustomTree" class="tree-children open"></div>
                </div>
              </div>
            </div>

            <div id="esMain" class="es-main">
              <!-- 评测集生成 -->
              <div data-sub="gen" class="es-sub">
                <div class="card card-pad">
                  <div class="card-t">选择文件类型</div>
                  <div class="seg-wrap"><span class="seg-label">从</span>
                    <div class="seg" id="srcTypeSeg">
                      <button class="on" data-type="doc">待生成问答文件</button>
                      <button data-type="qa">仅泛化</button>
                    </div>
                  </div>
                  <div class="src-list" id="srcList"><!-- 由 app.js 渲染 --></div>
                </div>

                <div class="card card-pad mt" id="studioOptCard">
                  <div id="studioOpts"><!-- 由 app.js 渲染：按来源类型动态显示选项 --></div>
                  <div class="studio-run-wrap"><button class="btn primary" id="studioRun"><i data-lucide="play"></i>开始生成</button></div>
                </div>

                <div class="card card-pad mt">
                  <div class="card-t">运行监测</div>
                  <div id="genProgress" class="gen-progress" hidden></div>
                  <div id="monitorList"></div>
                </div>
              </div>

              <!-- 评测集展示 -->
              <div data-sub="show" class="es-sub" hidden>
                <!-- 生成库（原按文档问答库：质量与人工审核） -->
                <div id="esGenerate" class="es-pane">
                  <div class="card card-pad">
                    <div class="lib-split qa-library-content">
                      <div id="qaContent"></div>
                    </div>
                  </div>
                </div>

                <!-- 上传库 -->
                <div id="esUploaded" class="es-pane" hidden>
                  <div class="card card-pad">
                    <div id="esUploadedList" class="es-list"></div>
                  </div>
                </div>

                <!-- 公共库 -->
                <div id="esPublic" class="es-pane" hidden>
                  <div class="card card-pad">
                    <div id="esPublicList" class="es-list"></div>
                  </div>
                </div>

                <!-- 评测集库 -->
                <div id="esCustom" class="es-pane" hidden>
                  <div class="card card-pad">
                    <div id="esCustomList" class="es-list"></div>
                  </div>
                </div>

                <div id="esLibraryDocDetail" class="es-pane" hidden></div>

              </div>
            </div>
          </div>
        </section>

        <!-- ============ 评测运行（m08：来源选择 / 发起 / 进度 / 结果） ============ -->
        <section class="view" data-view="evaluation" hidden>
          <div class="page-head">
            <div><h1>评测运行</h1><p class="sub">配置目标智能体、选择评测库版本并查看评测报告</p></div>
          </div>
          <div id="evWorkspace"></div>
        </section>

        </div><!-- /split-left -->

        <div class="split-divider" id="splitDivider" hidden><span></span></div>

        <aside class="split-right" id="splitRight" hidden>
          <div class="ask-top">
            <div class="ask-top-t"><i data-lucide="bot"></i>智能问答</div>
            <div class="ask-top-acts">
              <button class="icon-btn ask-max" id="askMax" aria-label="放大/缩小"><i data-lucide="maximize-2"></i></button>
              <button class="icon-btn ask-close" id="askClose" aria-label="收起"><i data-lucide="x"></i></button>
            </div>
          </div>
          <div class="ask-chips">
            <button class="ask-chip" data-q="列出全部评测集"><i data-lucide="list"></i>列出全部评测集</button>
            <button class="ask-chip" data-q="列出知识点"><i data-lucide="list-checks"></i>列出知识点</button>
            <button class="ask-chip" data-q="删除 Q-101"><i data-lucide="trash-2"></i>删除某条评测集</button>
            <button class="ask-chip" data-q="参数输入怎么填"><i data-lucide="sliders-horizontal"></i>参数说明</button>
            <button class="ask-chip" data-q="怎么新建评测集任务"><i data-lucide="help-circle"></i>操作指引</button>
          </div>
          <div class="ask-main">
            <div class="chat" id="chatFlow"></div>
            <div class="chat-input">
              <input type="text" id="chatInput" placeholder="例如：删除 Q-102 / 列出 L2 评测集 / 参数怎么填" />
              <button class="btn primary" id="chatSend"><i data-lucide="send"></i></button>
            </div>
          </div>
        </aside>

      </main>
  </div>

  <div id="toast" style="position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:90;display:none;background:var(--brand-deep,#102C50);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 12px 30px rgba(18,69,113,.4)"></div>

  <!-- 应用脚本（按依赖顺序分文件加载，等价于原单文件 app.js，去掉 IIFE 包裹，统一为全局作用域） -->
  <script src="js/00-head.js?v=9"></script>
  <script src="js/01-data.js?v=9"></script>
  <script src="js/02-nav.js?v=15"></script>
  <script src="js/03-lib.js?v=18"></script>
  <script src="js/04-upload.js?v=9"></script>
  <script src="js/05-evalset-generate.js?v=5"></script>
  <script src="js/06-chat.js?v=9"></script>
  <script src="js/07-init.js?v=10"></script>
  <script src="js/08-evalset-library.js?v=23"></script>
  <script src="js/09-evaluation.js?v=9"></script>
  <script src="js/10-evaluation-workspace.js?v=5"></script>
  <script src="js/11-overview-flow.js?v=2"></script>
  <script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
