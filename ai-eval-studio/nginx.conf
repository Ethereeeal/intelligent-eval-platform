server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源（含 Lucide / Chart.js 本地库与字体回退）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 长时间缓存带哈希/固定名的第三方库
    location ~* \.(js|css|woff2?|png|jpg|svg)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
