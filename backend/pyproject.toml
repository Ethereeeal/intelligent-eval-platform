[project]
name = "evalforge-backend"
version = "0.1.0"
description = "Backend service for the EvalForge demo"
requires-python = ">=3.10"
dependencies = [
	"fastapi>=0.115.0",
	"uvicorn[standard]>=0.30.0",
	"pydantic>=2.8.0",
	"sqlalchemy>=2.0.0",
	"pymysql>=1.1.1",
	"minio>=7.2.0",
	"faiss-cpu>=1.8.0",
	"numpy>=1.26.0",
	"sentence-transformers>=3.0.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
