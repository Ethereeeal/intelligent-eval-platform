[project]
name = "intelligent_eval_demo"
version = "0.1.0"
description = "Local demo backend for intelligent evaluation platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "sqlalchemy>=2.0.0",
    "python-multipart>=0.0.6",
	"requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
